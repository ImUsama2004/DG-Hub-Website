name: DG-Hub AWS CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t muhammadusamasaeed/dg-hub:${{ github.sha }} .
          docker push muhammadusamasaeed/dg-hub:${{ github.sha }}


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Test SSH key
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_USER: ${{ secrets.EC2_USER }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}

        run: |

          mkdir -p "$HOME/.ssh"

          printf '%s\n' "$EC2_SSH_KEY" > "$HOME/.ssh/project.pem"

          chmod 600 "$HOME/.ssh/project.pem"

          echo "Checking SSH key format..."

          ssh-keygen -y -f "$HOME/.ssh/project.pem" > /dev/null

          echo "SSH key format is valid."

          ssh-keyscan -H "$EC2_HOST" >> "$HOME/.ssh/known_hosts"

          echo "Testing SSH authentication..."

          ssh \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            -i "$HOME/.ssh/project.pem" \
            "$EC2_USER@$EC2_HOST" \
            "echo SSH authentication successful"