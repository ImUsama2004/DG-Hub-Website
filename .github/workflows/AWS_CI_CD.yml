name: DG-Hub AWS CI/CD

on:
  push:
    branches:
      - main

jobs:

  build-and-push:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build application
        run: npm run build

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push Docker image
        run: |
          docker build -t muhammadusamasaeed/dg-hub:${{ github.sha }} .
          docker push muhammadusamasaeed/dg-hub:${{ github.sha }}


  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ap-southeast-2

      - name: Deploy to AWS EC2 using SSM
        env:
          EC2_INSTANCE_ID: i-0986186c0d9594de1
          IMAGE_TAG: ${{ github.sha }}
        run: |

          echo "Sending deployment command to EC2..."

          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "$EC2_INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "echo Pulling new DG-Hub image...",
              "docker pull muhammadusamasaeed/dg-hub:'"$IMAGE_TAG"'",
              "echo Stopping old container...",
              "docker stop dg-hub || true",
              "echo Removing old container...",
              "docker rm dg-hub || true",
              "echo Starting new container...",
              "docker run -d --name dg-hub --restart unless-stopped -p 80:80 muhammadusamasaeed/dg-hub:'"$IMAGE_TAG"'",
              "echo Deployment completed!"
            ]' \
            --comment "DG-Hub deployment $IMAGE_TAG" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          echo "Waiting for deployment to complete..."

          for i in {1..30}; do

            STATUS=$(aws ssm get-command-invocation \
              --command-id "$COMMAND_ID" \
              --instance-id "$EC2_INSTANCE_ID" \
              --query "Status" \
              --output text)

            echo "Deployment status: $STATUS"

            if [ "$STATUS" = "Success" ]; then
              echo "Deployment successful!"
              exit 0
            fi

            if [ "$STATUS" = "Failed" ] || \
               [ "$STATUS" = "Cancelled" ] || \
               [ "$STATUS" = "TimedOut" ]; then
              echo "Deployment failed!"
              exit 1
            fi

            sleep 5
          done

          echo "Deployment timed out!"
          exit 1

