apiVersion: apps/v1
kind: Deployment

metadata:
  name: dg-hub

spec:
  replicas: 2

  selector:
    matchLabels:
      app: dg-hub

  template:
    metadata:
      labels:
        app: dg-hub

    spec:
      containers:
        - name: dg-hub
          image: muhammadusamasaeed/dg-hub:latest

          ports:
            - containerPort: 80

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"

            limits:
              cpu: "500m"
              memory: "256Mi"

          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 10
            periodSeconds: 20